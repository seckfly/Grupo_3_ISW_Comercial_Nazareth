name: Exportar diagrama CU01 a PNG

on:
  push:
    branches: [main]
    paths:
      - "modelos/iter1/actividad-registrar-venta.svg"
      - ".github/workflows/export-cu01-png.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Instalar conversor SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Exportar diagrama a PNG
        run: rsvg-convert --format=png --width=1472 --output=modelos/iter1/actividad-registrar-venta.png modelos/iter1/actividad-registrar-venta.svg
      - name: Incorporar PNG al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modelos/iter1/actividad-registrar-venta.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ITER1: incorpora exportación PNG de CU01"
          git push origin HEAD:main
