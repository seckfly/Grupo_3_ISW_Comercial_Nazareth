<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1280" viewBox="0 0 1100 1280">
<title>CU01 Registrar venta</title>
<desc>Flujo especificado para registrar una venta, con excepciones por datos inválidos, stock insuficiente y fallo de persistencia. El informe señala que la interfaz todavía no invoca la transacción del backend.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172B4D;font-size:18px;text-anchor:middle}
.box{fill:#fff;stroke:#536273;stroke-width:2}
.decision{fill:#FFF4D6;stroke:#B28A2E;stroke-width:2}
.error{fill:#FCE8E6;stroke:#B3261E;stroke-width:2}
.comp{fill:#E8F0FE;stroke:#1A73E8;stroke-width:2}
.success{fill:#E2F0D9;stroke:#548235;stroke-width:2}
.edge{fill:none;stroke:#536273;stroke-width:2.5;marker-end:url(#arrow)}
.red{fill:none;stroke:#B3261E;stroke-width:2.5;marker-end:url(#arrowRed)}
.blue{fill:none;stroke:#1A73E8;stroke-width:2.5;marker-end:url(#arrowBlue)}
.green{fill:none;stroke:#548235;stroke-width:2.5;marker-end:url(#arrowGreen)}
.small{font-size:15px}
</style>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536273"/></marker>
<marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B3261E"/></marker>
<marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1A73E8"/></marker>
<marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#548235"/></marker>
</defs>
<text x="550" y="34" style="font-size:26px;font-weight:bold">CU01 Registrar venta</text>
<text x="550" y="60" class="small">Flujo especificado. La integración interfaz–backend sigue pendiente.</text>
<ellipse cx="550" cy="105" rx="55" ry="24" fill="#222" stroke="#222"/><text x="550" y="111" style="fill:#fff">Inicio</text>
<path class="edge" d="M550 129 V150"/>
<rect class="box" x="360" y="150" width="380" height="64" rx="12"/><text x="550" y="176"><tspan x="550">Seleccionar productos y cantidades</tspan><tspan x="550" dy="22">mediante CU03</tspan></text>
<path class="edge" d="M550 214 V235"/>
<rect class="box" x="360" y="235" width="380" height="64" rx="12"/><text x="550" y="261"><tspan x="550">Validar venta no vacía y</tspan><tspan x="550" dy="22">cantidades positivas</tspan></text>
<path class="edge" d="M550 299 V320"/>
<polygon class="decision" points="550,320 660,370 550,420 440,370"/><text x="550" y="376">¿Venta válida?</text>
<path class="edge" d="M550 420 V455"/>
<text x="574" y="442" class="small">Sí</text>
<path class="red" d="M660 370 H790"/>
<text x="720" y="355" class="small">No</text>
<rect class="error" x="790" y="330" width="270" height="82" rx="12"/><text x="925" y="354"><tspan x="925">E2: venta vacía o datos</tspan><tspan x="925" dy="21">no válidos. Solicitar</tspan><tspan x="925" dy="21">corrección.</tspan></text>
<polygon class="decision" points="550,455 660,505 550,555 440,505"/><text x="550" y="511">¿Stock suficiente?</text>
<path class="edge" d="M550 555 V590"/>
<text x="574" y="577" class="small">Sí</text>
<path class="red" d="M660 505 H790"/>
<text x="720" y="490" class="small">No</text>
<rect class="error" x="790" y="465" width="270" height="82" rx="12"/><text x="925" y="489"><tspan x="925">E1: rechazar la venta</tspan><tspan x="925" dy="21">e informar que falta</tspan><tspan x="925" dy="21">stock.</tspan></text>
<rect class="box" x="360" y="590" width="380" height="64" rx="12"/><text x="550" y="616"><tspan x="550">Calcular total y elegir</tspan><tspan x="550" dy="22">efectivo, Yape o Plin</tspan></text>
<path class="edge" d="M550 654 V675"/>
<rect class="box" x="360" y="675" width="380" height="64" rx="12"/><text x="550" y="701"><tspan x="550">Registrar monto recibido o</tspan><tspan x="550" dy="22">referencia digital</tspan></text>
<path class="edge" d="M550 739 V760"/>
<rect class="box" x="360" y="760" width="380" height="78" rx="12"/><text x="550" y="786"><tspan x="550">Guardar venta, detalle y movimiento;</tspan><tspan x="550" dy="22">descontar stock en la transacción</tspan></text>
<path class="edge" d="M550 838 V860"/>
<polygon class="decision" points="550,860 660,910 550,960 440,910"/><text x="550" y="906"><tspan x="550">¿Persistencia</tspan><tspan x="550" dy="20">completada?</tspan></text>
<path class="green" d="M550 960 V990"/>
<text x="574" y="980" class="small">Sí</text>
<path class="red" d="M660 910 H790"/>
<text x="720" y="895" class="small">No</text>
<rect class="error" x="790" y="870" width="270" height="82" rx="12"/><text x="925" y="894"><tspan x="925">E3: fallo de persistencia.</tspan><tspan x="925" dy="21">No confirmar la venta.</tspan></text>
<path class="blue" d="M925 952 V980"/>
<rect class="comp" x="790" y="980" width="270" height="82" rx="12"/><text x="925" y="1004"><tspan x="925">C1: revertir la transacción</tspan><tspan x="925" dy="21">para no dejar stock</tspan><tspan x="925" dy="21">descontado sin venta.</tspan></text>
<rect class="success" x="360" y="990" width="380" height="64" rx="12"/><text x="550" y="1016"><tspan x="550">Confirmar y mostrar la</tspan><tspan x="550" dy="22">identificación de venta</tspan></text>
<path class="green" d="M550 1054 V1090"/>
<ellipse cx="550" cy="1114" rx="55" ry="24" fill="#222" stroke="#222"/><text x="550" y="1120" style="fill:#fff">Fin</text>
<text x="550" y="1180" class="small">E1: stock insuficiente · E2: datos inválidos · E3: fallo de persistencia · C1: rollback</text>
<text x="550" y="1205" class="small">El diagrama modela el flujo especificado, no evidencia de integración completada.</text>
</svg>