<title id="title">CU01 · Registrar venta</title><desc id="desc">Diagrama de actividad con carriles para vendedor, interfaz y sistema, con validación de datos, stock, pago y persistencia.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 z" fill="#536273"/></marker></defs>
<rect width="1550" height="1900" fill="#FFFFFF"/>
<text x="775" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#24364B">CU01 · Registrar venta</text>
<text x="775" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#536273">Diagrama de actividad</text>
<rect x="30" y="90" width="470" height="1770" fill="#FAFBFC" stroke="#A7B0BC" stroke-width="1.5"/><rect x="30" y="90" width="470" height="48" fill="#DCE6F1" stroke="#A7B0BC"/><text x="265" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364B">VENDEDOR · SEÑOR HUMBERTO</text><rect x="530" y="90" width="470" height="1770" fill="#FAFBFC" stroke="#A7B0BC" stroke-width="1.5"/><rect x="530" y="90" width="470" height="48" fill="#DCE6F1" stroke="#A7B0BC"/><text x="765" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364B">INTERFAZ</text><rect x="1030" y="90" width="470" height="1770" fill="#FAFBFC" stroke="#A7B0BC" stroke-width="1.5"/><rect x="1030" y="90" width="470" height="48" fill="#DCE6F1" stroke="#A7B0BC"/><text x="1265" y="119" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#24364B">SISTEMA / SERVICIO</text><polyline id="a01" points="260,202 260,230" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a02" points="420,266 600,266" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a03" points="765,302 765,335" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a04" points="855,377.5 970,377 970,480 1100,480" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a05" points="765,420 765,445" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a06" points="600,477.5 70,477.5 70,266 100,266" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a07" points="1265,515 1265,540" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a08" points="1175,582.5 970,582.5 970,587.5 930,587.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a09" points="1265,625 1460,625 1460,640 260,640 260,660" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a10" points="600,587.5 85,587.5 85,320 260,320 260,302" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a11" points="345,702.5 470,702.5 470,802.5 600,802.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a12" points="260,745 260,880" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a13" points="765,835 765,847 450,847 450,912.5 420,912.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a14" points="260,945 260,960 970,960 970,860 1265,860 1265,880" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a15" points="1430,912.5 1450,912.5 1450,1010 970,1010 930,1010" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a16" points="600,1010 500,1010 500,1117.5 420,1117.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a17" points="420,1117.5 1100,1117.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a18" points="1265,1155 1265,1180" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a19" points="1175,1222.5 970,1222.5 970,1232.5 930,1232.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a20" points="1265,1265 1265,1310" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a21" points="600,1232.5 60,1232.5 60,912.5 100,912.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a22" points="1265,1388 1265,1410" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a23" points="1175,1452.5 930,1452.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a24" points="1265,1495 1265,1530" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a25" points="1090,1567.5 970,1567.5 970,1657.5 930,1657.5" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a26" points="765,1485 765,1515" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><polyline id="a27" points="765,1690 765,1735" fill="none" stroke="#536273" stroke-width="2.4" stroke-linejoin="miter" marker-end="url(#arrow)"/><g id="start"><ellipse cx="260" cy="181" rx="45" ry="21" fill="#222222" stroke="#222222" stroke-width="2"/><text x="260" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Inicio</text></g><g id="select"><rect x="100" y="230" width="320" height="72" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="260" y="261.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Consultar catálogo (CU03) y seleccionar</text><text x="260" y="280.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">productos y cantidades</text></g><g id="validate"><rect x="600" y="230" width="330" height="72" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="765" y="261.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Validar que la venta no esté vacía</text><text x="765" y="280.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">y que las cantidades sean válidas</text></g><g id="dcart"><polygon points="765,335 855,377.5 765,420 675,377.5" fill="#FFF2CC" stroke="#B28A2E" stroke-width="2"/><text x="765" y="373" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">¿Datos</text><text x="765" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">válidos?</text></g><g id="ecart"><rect x="600" y="445" width="330" height="65" rx="12" fill="#FCE8E6" stroke="#B3261E" stroke-width="2"/><text x="765" y="482.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">E2 · Solicitar corrección de la venta</text></g><g id="stock"><rect x="1100" y="445" width="330" height="70" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="1265" y="475.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Comprobar productos activos y</text><text x="1265" y="494.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">verificar stock suficiente</text></g><g id="dstock"><polygon points="1265,540 1355,582.5 1265,625 1175,582.5" fill="#FFF2CC" stroke="#B28A2E" stroke-width="2"/><text x="1265" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">¿Stock</text><text x="1265" y="597" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">suficiente?</text></g><g id="estock"><rect x="600" y="550" width="330" height="75" rx="12" fill="#FCE8E6" stroke="#B3261E" stroke-width="2"/><text x="765" y="583" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">E1 · Informar la falta de stock</text><text x="765" y="602" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">y rechazar el intento actual</text></g><g id="dcustomer"><polygon points="260,660 345,702.5 260,745 175,702.5" fill="#FFF2CC" stroke="#B28A2E" stroke-width="2"/><text x="260" y="698" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">¿Cliente</text><text x="260" y="717" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">registrado?</text></g><g id="cu02"><rect x="600" y="770" width="330" height="65" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="765" y="798" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">CU02 · Vincular al cliente</text><text x="765" y="817" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">a la venta</text></g><g id="payment"><rect x="100" y="880" width="320" height="65" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="260" y="917.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Elegir efectivo, Yape o Plin</text></g><g id="calc"><rect x="1100" y="880" width="330" height="65" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="1265" y="917.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Calcular el total de la venta</text></g><g id="fields"><rect x="600" y="975" width="330" height="70" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="765" y="1005.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Mostrar el total y los campos</text><text x="765" y="1024.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">del método de pago elegido</text></g><g id="enter"><rect x="100" y="1080" width="320" height="75" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="260" y="1113" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Registrar el monto recibido</text><text x="260" y="1132" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">o la referencia digital</text></g><g id="validate_payment"><rect x="1100" y="1080" width="330" height="75" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="1265" y="1113" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Validar el monto o la referencia;</text><text x="1265" y="1132" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">calcular el vuelto si corresponde</text></g><g id="dpayment"><polygon points="1265,1180 1355,1222.5 1265,1265 1175,1222.5" fill="#FFF2CC" stroke="#B28A2E" stroke-width="2"/><text x="1265" y="1218" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">¿Datos de pago</text><text x="1265" y="1237" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">válidos?</text></g><g id="epayment"><rect x="600" y="1200" width="330" height="65" rx="12" fill="#FCE8E6" stroke="#B3261E" stroke-width="2"/><text x="765" y="1228" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">Solicitar un método o dato</text><text x="765" y="1247" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">de pago válido</text></g><g id="persist"><rect x="1090" y="1310" width="350" height="78" rx="12" fill="#FFFFFF" stroke="#536273" stroke-width="2"/><text x="1265" y="1344.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">Guardar venta, detalle y movimiento;</text><text x="1265" y="1363.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#202833">descontar stock en una transacción</text></g><g id="dpersist"><polygon points="1265,1410 1355,1452.5 1265,1495 1175,1452.5" fill="#FFF2CC" stroke="#B28A2E" stroke-width="2"/><text x="1265" y="1448" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">¿Se guardó</text><text x="1265" y="1467" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#202833">correctamente?</text></g><g id="confirm"><rect x="600" y="1420" width="330" height="65" rx="12" fill="#E2F0D9" stroke="#548235" stroke-width="2"/><text x="765" y="1448" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#24451D">Mostrar la identificación</text><text x="765" y="1467" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#24451D">de la venta</text></g><g id="rollback"><rect x="1090" y="1530" width="350" height="75" rx="12" fill="#FCE8E6" stroke="#B3261E" stroke-width="2"/><text x="1265" y="1563" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">E3 / C1 · Revertir la transacción;</text><text x="1265" y="1582" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">no dejar una venta parcial</text></g><g id="notconfirmed"><rect x="600" y="1625" width="330" height="65" rx="12" fill="#FCE8E6" stroke="#B3261E" stroke-width="2"/><text x="765" y="1653" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">Mostrar que la venta</text><text x="765" y="1672" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">no fue confirmada</text></g><g id="ends"><ellipse cx="765" cy="1535" rx="24" ry="20" fill="#FFFFFF" stroke="#222222" stroke-width="3"/><text x="765" y="1540" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#202833">Fin</text></g><g id="endf"><ellipse cx="765" cy="1755" rx="24" ry="20" fill="#FFFFFF" stroke="#222222" stroke-width="3"/><text x="765" y="1760" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#202833">Fin</text></g><text id="lbl_a04" x="996" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Sí</text><text id="lbl_a05" x="799" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">No</text><text id="lbl_a06" x="152" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Corregir datos</text><text id="lbl_a08" x="1001" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">No</text><text id="lbl_a09" x="1399" y="661" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Sí</text><text id="lbl_a10" x="157.5" y="575" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Nueva selección</text><text id="lbl_a11" x="494" y="697" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Sí</text><text id="lbl_a12" x="289" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">No</text><text id="lbl_a19" x="999" y="1220" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">No</text><text id="lbl_a20" x="1299" y="1285" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Sí</text><text id="lbl_a21" x="126" y="1190" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Corregir pago</text><text id="lbl_a23" x="989" y="1442" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">Sí</text><text id="lbl_a24" x="1299" y="1515" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#24364B">No</text>
</svg>